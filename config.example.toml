# ~/.config/jt/config.toml
#
# Top-level settings come first: in TOML every key after a [table] header
# belongs to that table, so anything below [site] would become a site setting.

# Runs when no work item is pinned by argument, $JT_ISSUE, or branch name.
default_query = "assignee = currentUser() AND resolution = Unresolved ORDER BY updated DESC"

# Only these fields are requested from the API. Adding a column fetches it.
columns = ["key", "status", "issuetype", "summary", "assignee", "priority", "updated"]

leader = " "
# Editor command and optional flags. Resolution is this value, then $EDITOR,
# then vi. The scratch filename is passed as one final argument without a shell.
# editor = "nvim -f"
images = "off"         # "sixel" reserved for a later version

[site]
url   = "https://your-site.atlassian.net"
email = "you@example.com"

# Token resolution order: $JIRA_API_TOKEN, then token_command, then token.
# token_command runs once per process and is held in memory only, so this file
# can live in public dotfiles.
token_command = "pass show jira/token"
# token = "..."   # plaintext fallback; requires chmod 0600 on this file

# Expanded by :jql @name
[queries]
mine   = "assignee = currentUser() AND resolution = Unresolved ORDER BY updated DESC"
review = "status = 'In Review' AND project = PROJ ORDER BY updated DESC"

[timeouts]
request = "15s"

# Merged over the defaults -- you only list what you change.
# Set a binding to "" to unbind it. A binding that collides with a default
# one -- the same keys, or the start of a longer sequence -- is refused at
# startup naming both actions, so rebind or unbind the other one too.
# See ? in the app for the bindings actually in effect.
[keys]
# transition = "<leader>t"

# Bind a named workflow transition to a key, applying it without opening the
# picker. The name is resolved live at the keypress, against the transitions
# the focused item actually offers, so a binding never applies a stale id --
# and it reports what is available when the named one is not.
#
# These are their own table rather than more [keys] entries because [keys] is a
# closed set of actions jt knows, while a transition name is only checkable
# against your site. They compile together, so binding one over an existing key
# is refused at startup.
[transitions]
# "In Progress" = "<leader>ms"
# "Done"        = "<leader>md"
